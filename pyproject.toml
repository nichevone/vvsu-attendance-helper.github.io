[project]
name = "vvsu-attendance-helper"
version = "0.1.0"
description = "Little thing helping track attendance"
readme = "README.md"
authors = [
    { name = "nichevone", email = "stepan.mikhailov.20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
vvsu-timetable-parser = "vvsu_timetable_parser:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
