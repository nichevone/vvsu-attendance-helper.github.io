name: Update today's timetable

on:
  schedule:
    # 15:00 UTC = 01:00 the next day in Vladivostok (UTC+10)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch timetable
        run: python update_timetable.py

      - name: Commit updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetable.json
          if git diff --cached --quiet; then
            echo "Timetable did not change; nothing to commit."
          else
            git commit -m "Update today's timetable"
            git push
          fi
