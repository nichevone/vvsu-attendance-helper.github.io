
name: Update today's timetable

on:
  schedule:
    # 15:00 UTC = 01:00 the next day in Vladivostok (UTC+10)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Update timetable
        run: uv run python get-timetable.py

      - name: Commit updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetable.json
          if git diff --cached --quiet; then
            echo "Timetable did not change; nothing to commit."
          else
            git commit -m "Update today's timetable"
            git push
          fi
